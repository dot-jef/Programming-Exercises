<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>To Do List</h1>
    <div id="toDoList">
        <div id="tasksList">
            <!-- Here is where the tasks are going to be shown -->
        </div>
        <button id="addTaskButton">Add +</button>
    </div>


    <div id="taskModal" hidden>
        <h1>Add Task</h1>
        <form id="taskForm">
            <input placeholder="Enter Title..." name="title" id="modalTitle"></input>
            <textarea placeholder="Enter descriptions..." name="description" id="modalDescription"></textarea>
            <input type="text" name="status" hidden value="pending">
            <div class="taskModalButtons">
                <button type="reset" class="cancel">Close</button>
                <button type="submit" class="confirm">Add</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
